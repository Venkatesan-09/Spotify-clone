[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"  # Optional: if using Netlify functions

[build.environment]
  NODE_VERSION = "18"  # Use Node.js 18 or 20

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"